# Monthly update PRs for npm packages, the deploy tooling (.github/deploy) and the pinned
# GitHub Actions. Minor and patch bumps come grouped; each major version gets its own PR.
# Security fixes come sooner: Dependabot security updates are on for the repo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /.github/deploy
    schedule:
      interval: monthly
    groups:
      deploy-tools:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
