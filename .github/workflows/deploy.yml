name: Deploy

# Builds the site with its résumé PDF and uploads dist/ to Cloudflare Pages.
#   push to main, daily run  → production (the daily run picks up new Medium posts,
#                              which the build reads from RSS)
#   pull request (this repo) → a preview URL; fork PRs get no secrets, so they skip
#   Dependabot PR            → build only: it gets no secrets, and an unreviewed dependency
#                              shouldn't run next to the Cloudflare token anyway
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PAGES_PROJECT: khalid-elhousieny

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      # The runner image ships Google Chrome, which scripts/resume-pdf.mjs finds.
      - name: Build site and résumé PDF
        env:
          MEDIUM_HANDLE: ${{ secrets.MEDIUM_HANDLE }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          # Without these the Medium link, Writing section and email links drop silently.
          if [ "$DEPENDABOT_PR" != true ] && { [ -z "$MEDIUM_HANDLE" ] || [ -z "$CONTACT_EMAIL" ]; }; then
            echo "::error::Set the MEDIUM_HANDLE and CONTACT_EMAIL repository secrets."; exit 1
          fi
          npm run resume:pdf
          test -s dist/resume.pdf

      # A script or style the CSP doesn't hash would be blocked in the browser, not at build.
      - run: node scripts/check-csp.mjs

      - name: Deploy to Cloudflare Pages
        if: env.DEPENDABOT_PR != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        # Wrangler comes from .github/deploy's lockfile (whole tree pinned, install scripts off),
        # since this step holds the Cloudflare token.
        run: |
          npm ci --prefix .github/deploy --ignore-scripts --no-audit --no-fund
          .github/deploy/node_modules/.bin/wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" --branch="$BRANCH" --commit-hash="$GITHUB_SHA"

      # A failed production deploy needs a human; the daily run repeats the ping until it's fixed.
      - name: Telegram alert
        if: failure() && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Website deploy failed (${GITHUB_EVENT_NAME}). Open the run, fix the failing step, then Re-run jobs: ${RUN_URL}"
